<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarvelReview - Mot de passe oublié</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("marvelreview:theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_error) {}
      })();
    </script>
  </head>
  <body>
    <main class="container">
      <div id="nav-root"></div>

      <h1>Mot de passe oublié</h1>
      <p id="auth-status" class="status"></p>

      <form id="forgot-password-form" class="form card forgot-form">
        <label>
          <span class="field-label"
            >Email du compte <span class="required-star" aria-hidden="true">*</span></span
          >
          <input id="email" type="email" required />
        </label>

        <p class="field-required-note"><span class="required-star" aria-hidden="true">*</span> obligatoire</p>

        <div id="forgot-password-captcha" class="captcha-block"></div>

        <button type="submit">Envoyer le lien de réinitialisation</button>
        <p id="form-message" class="message" aria-live="polite"></p>
        <p id="forgot-delivery-warning" class="delivery-warning" hidden>
          📬 Le mail peut arriver en <strong>Indésirable / Spam</strong> (fréquent lors des premiers envois).
          Si besoin, vérifie ce dossier après 2 à 3 minutes.
        </p>
      </form>
    </main>

    <script type="module" src="/app/common.js"></script>
    <script type="module" src="/app/forgot-password.js"></script>
  </body>
</html>
